<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discipleship Dashboard · Church at The Mill</title>
<style>
:root{
  --ink:#16222E; --ink2:#41525F; --ink3:#72828D;
  --paper:#EDEFEE; --card:#FFFFFF; --rule:#D2D8D6; --rule2:#E4E8E7;
  --met:#2F6B4F; --met-bg:#E4EEE8;
  --watch:#9C7020; --watch-bg:#F5EDDD;
  --quiet:#96342A; --quiet-bg:#F6E5E2;
  --link:#1D4E5C;
  --r:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Times New Roman",Times,serif;
  font-size:16.5px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; font-weight:600; letter-spacing:-.011em}
a{color:var(--link)}
button,input,select,textarea{font:inherit; color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}

/* masthead */
.masthead{background:var(--ink);color:#EDEFEE;padding:18px 0 16px}
.masthead .wrap{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
.brand h1{font-size:19px;color:#fff;line-height:1.2}
.brand p{margin:2px 0 0;font-size:14px;color:#93A3AE}
.mast-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.yearchip{font-size:14px;color:#A8B7C1;border:1px solid #33465A;border-radius:var(--r);padding:5px 10px}
.btn{
  background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
  padding:6px 12px;font-size:14.5px;font-weight:500;cursor:pointer;color:var(--ink);
}
.btn:hover{background:#F4F6F5}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,
.mark:focus-visible{outline:2px solid #1D7A93;outline-offset:2px}
.btn.primary{background:var(--link);border-color:var(--link);color:#fff}
.btn.primary:hover{background:#17414D}
.btn.primary:disabled{background:#9AAAB1;border-color:#9AAAB1;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:#3A4E60;color:#D6DEE3}
.btn.ghost:hover{background:#22323F}
.btn.sm{padding:4px 9px;font-size:13.5px}

/* tabs */
.tabbar{background:var(--card);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:20}
.tabbar .wrap{display:flex;gap:2px;overflow-x:auto}
.tab{
  background:none;border:0;border-bottom:2px solid transparent;
  padding:13px 14px;font-size:14px;font-weight:500;color:var(--ink2);cursor:pointer;white-space:nowrap;
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.tab .cnt{color:var(--ink3);font-weight:400;margin-left:5px;font-variant-numeric:tabular-nums}

.shell{display:flex;align-items:flex-start;gap:0;max-width:1400px;margin:0 auto}
.content{flex:1;min-width:0;padding:24px 26px 70px}
.sidenav{width:225px;flex:none;background:var(--card);border-right:1px solid var(--rule);
  min-height:calc(100vh - 86px);padding:16px 0 40px;position:sticky;top:0}
.modblock{margin-bottom:6px}
.modbtn{display:flex;width:100%;align-items:center;gap:9px;background:none;border:0;cursor:pointer;
  padding:11px 18px;font-size:16px;font-weight:700;color:var(--ink2);text-align:left;font-family:inherit}
.modbtn:hover{color:var(--ink);background:#F6F8F7}
.modbtn.on{color:var(--ink)}
.modbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--rule);flex:none}
.modbtn.on .dot{background:var(--link)}
.modbtn .sub{display:block;font-size:13px;font-weight:400;color:var(--ink3);margin-top:1px}
.modnav{padding:2px 0 10px}
.navbtn{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;
  padding:7px 18px 7px 35px;font-size:15px;color:var(--ink2);font-family:inherit;
  border-left:3px solid transparent}
.navbtn:hover{color:var(--ink);background:#F6F8F7}
.navbtn[aria-current="true"]{color:var(--ink);font-weight:700;border-left-color:var(--ink);background:#F2F5F4}
.navbtn .cnt{color:var(--ink3);font-weight:400;font-size:13.5px;float:right}
.modrule{height:1px;background:var(--rule2);margin:8px 16px}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:9px}
.fstep{position:relative;background:#F4F6F5;border:1px solid var(--rule2);border-radius:var(--r);
  padding:12px 16px;overflow:hidden}
.fstep .fill{position:absolute;inset:0;background:var(--link);opacity:.11}
.fstep .row{position:relative;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.fstep .v{font-size:27px;font-weight:700;line-height:1.1}
.fstep .l{font-size:15px;color:var(--ink2)}
.fstep .p{margin-left:auto;font-size:15px;color:var(--ink2);font-weight:700}
.fdrop{display:flex;align-items:center;gap:9px;padding:2px 16px;font-size:14px;color:var(--quiet)}
.fdrop b{font-weight:700}
.fdrop .why{color:var(--ink3);font-weight:400}
.estimate{font-size:13px;color:var(--watch);margin-left:6px}

/* toggles + charts */
.toggle{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.toggle button{background:#fff;border:0;padding:6px 13px;font-size:14px;cursor:pointer;
  color:var(--ink2);font-family:inherit}
.toggle button+button{border-left:1px solid var(--rule)}
.toggle button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:700}
.chartwrap{padding:18px}
.chartwrap svg{display:block;width:100%;height:auto}
.clegend{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px;font-size:14px;color:var(--ink2)}
.clegend span{display:flex;align-items:center;gap:7px}
.clegend i{width:22px;height:3px;border-radius:2px;display:block}
.clegend i.dash{background:none;border-top:3px dashed var(--watch)}
.readout{font-size:14.5px;color:var(--ink2);line-height:1.55;padding:0 18px 18px;max-width:80ch}
.readout b{color:var(--ink)}

/* health + bands */
.hscore{display:inline-flex;align-items:baseline;gap:7px}
.hscore .n{font-size:17px;font-weight:700}
.band{display:inline-block;padding:1px 8px;border-radius:99px;font-size:13.5px;font-weight:700}
.b-thriving{background:var(--met-bg);color:var(--met)}
.b-steady{background:#E7EDF0;color:#2C5768}
.b-watch{background:var(--watch-bg);color:var(--watch)}
.b-risk{background:var(--quiet-bg);color:var(--quiet)}
.dir{font-size:14px;font-weight:700}
.dir.up{color:var(--met)} .dir.down{color:var(--quiet)} .dir.flat{color:var(--ink3)}

@media (max-width:900px){
  .shell{display:block}
  .sidenav{width:auto;min-height:0;position:static;border-right:0;border-bottom:1px solid var(--rule);
    display:flex;overflow-x:auto;padding:0}
  .modblock{display:flex;align-items:center;flex:none}
  .modbtn{white-space:nowrap;padding:12px 14px}
  .modbtn .sub{display:none}
  .modnav{display:flex;padding:0}
  .navbtn{padding:12px 12px;border-left:0;border-bottom:3px solid transparent;white-space:nowrap}
  .navbtn[aria-current="true"]{border-left:0;border-bottom-color:var(--ink)}
  .navbtn .cnt{float:none;margin-left:5px}
  .modrule{display:none}
  .content{padding:20px 18px 60px}
}
main{padding:0}
.view[hidden]{display:none}

/* hero week panel */
.week{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
  display:grid;grid-template-columns:270px 1fr;}
.week-fig{padding:24px 26px;border-right:1px solid var(--rule2)}
.week-fig .k{font-size:14px;color:var(--ink2);margin:0 0 10px}
.week-fig .big{font-size:58px;line-height:.95;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.week-fig .of{font-size:22px;color:var(--ink3);font-weight:500}
.week-fig .pct{margin:12px 0 0;font-size:15px;color:var(--ink2)}
.week-fig .pct b{font-weight:600;color:var(--ink)}
.bar{height:6px;background:var(--rule2);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--met)}
.week-grid{padding:22px 26px}
.week-grid .hdr{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.week-grid h2{font-size:14.5px}
.week-grid .sub{font-size:14px;color:var(--ink3)}
.segbar{display:flex;height:34px;border-radius:var(--r);overflow:hidden;border:1px solid var(--rule)}
.segbar i{display:block;height:100%}
.segbar .s-met{background:var(--met)}
.segbar .s-open{background:#DDE3E1}
.segbar .s-quiet{background:var(--quiet)}
.seglabels{display:flex;gap:26px;margin-top:12px;flex-wrap:wrap}
.seglabel{display:flex;gap:9px;align-items:flex-start}
.seglabel .sw{width:13px;height:13px;border-radius:2px;margin-top:4px;flex:none;border:1px solid}
.seglabel .v{font-size:23px;font-weight:700;line-height:1.1}
.seglabel .t{font-size:14px;color:var(--ink2)}
.groups{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule);border-radius:var(--r);margin-top:18px;overflow:hidden}
.grp{background:var(--card);padding:14px 16px}
.grp h3{font-size:15px;margin-bottom:3px}
.grp p{margin:0 0 9px;font-size:13.5px;color:var(--ink3)}
.grp ul{list-style:none;margin:0;padding:0;max-height:210px;overflow:auto}
.grp li{padding:4px 0;border-bottom:1px solid var(--rule2);font-size:14.5px}
.grp li:last-child{border-bottom:0}
.grp li button{background:none;border:0;padding:0;font:inherit;color:var(--link);cursor:pointer;text-align:left}
.grp li button:hover{text-decoration:underline}
.grp li .wk{float:right;color:var(--ink3);font-size:13.5px}
.grp.quiet h3{color:var(--quiet)}
@media (max-width:760px){.groups{grid-template-columns:1fr}}
.mark{width:19px;height:19px;border-radius:2px;border:1px solid;padding:0;cursor:pointer;background:none;display:block}
.mark.met{background:var(--met);border-color:var(--met)}
.mark.none{background:#fff;border-color:#BFC8C5}
.mark.quiet{background:var(--quiet);border-color:var(--quiet)}
.legend{display:flex;gap:18px;margin-top:16px;font-size:13.5px;color:var(--ink2);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.swatch{width:11px;height:11px;border-radius:2px;border:1px solid}

/* stat row */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule);border-radius:var(--r);margin-top:18px;overflow:hidden}
.stat{background:var(--card);padding:16px 18px}
.stat .v{font-size:30px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:14px;color:var(--ink2);margin-top:3px}
.stat .n{font-size:13px;color:var(--ink3);margin-top:5px}
.stat.alarm .v{color:var(--quiet)}
.stat button{background:none;border:0;padding:0;color:var(--link);font-size:13.5px;cursor:pointer;text-decoration:underline;margin-top:5px}

/* panels + tables */
.panel{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);margin-top:18px}
.panel-hd{padding:14px 18px;border-bottom:1px solid var(--rule2);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.panel-hd h2{font-size:15px}
.panel-hd p{margin:0;font-size:14px;color:var(--ink3)}
.panel-hd .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools{padding:12px 18px;border-bottom:1px solid var(--rule2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools input[type=search],.tools select{
  border:1px solid var(--rule);border-radius:var(--r);padding:6px 9px;font-size:14.5px;background:#fff}
.tools input[type=search]{min-width:210px}
.selnote{font-size:14px;color:var(--ink2);margin-left:auto}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
thead th{
  font-weight:700;font-size:14px;
  text-align:left;color:var(--ink2);background:#F7F8F8;
  padding:10px 12px;border-bottom:1px solid var(--rule);white-space:nowrap;vertical-align:bottom}
thead th .sortable{cursor:pointer;user-select:none}
thead th .sortable:hover{color:var(--ink)}
thead th .ar{color:var(--ink3);font-size:10px;margin-left:3px}
tbody td{padding:9px 12px;border-bottom:1px solid var(--rule2);vertical-align:middle}
tbody tr:hover{background:#F8FAF9}
tbody tr.sel{background:#EAF1F3}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.name{font-weight:700;white-space:nowrap}
td.people{min-width:260px;line-height:1.35}
td.people .tag{margin-left:4px;white-space:nowrap}
tbody td{max-width:340px}
td.sub{color:var(--ink2)}
.chk{width:34px}
.pill{display:inline-block;padding:1px 7px;border-radius:99px;font-size:13px;font-weight:500;white-space:nowrap}
.pill.met{background:var(--met-bg);color:var(--met)}
.pill.watch{background:var(--watch-bg);color:var(--watch)}
.pill.quiet{background:var(--quiet-bg);color:var(--quiet)}
.tag{font-size:13px;color:var(--ink2);background:#F0F2F1;border:1px solid var(--rule2);border-radius:var(--r);padding:1px 6px;white-space:nowrap}
.minibar{display:inline-block;vertical-align:middle;width:56px;height:5px;background:var(--rule2);border-radius:99px;overflow:hidden;margin-left:8px}
.minibar i{display:block;height:100%;background:var(--ink2)}
.empty{padding:40px 18px;text-align:center;color:var(--ink2);font-size:14px}
.empty b{display:block;font-size:15px;color:var(--ink);margin-bottom:4px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(18,28,36,.5);display:flex;align-items:center;
  justify-content:center;padding:20px;z-index:60}
.scrim[hidden]{display:none}
.modal{background:var(--card);border-radius:var(--r);width:min(660px,100%);max-height:88vh;
  display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(10,20,28,.28)}
.modal header{padding:16px 20px;border-bottom:1px solid var(--rule2);display:flex;align-items:center;gap:12px}
.modal header h2{font-size:16px}
.modal header button{margin-left:auto;background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--ink2)}
.modal .body{padding:18px 20px;overflow:auto}
.modal footer{padding:14px 20px;border-top:1px solid var(--rule2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.modal footer .sp{margin-left:auto;display:flex;gap:8px}
.field{margin-bottom:14px}
.field label{display:block;font-size:14px;color:var(--ink2);margin-bottom:5px}
.field input[type=text],.field textarea{width:100%;border:1px solid var(--rule);border-radius:var(--r);padding:8px 10px;font-size:14px}
.field textarea{min-height:150px;resize:vertical;line-height:1.5}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.seg button{background:#fff;border:0;padding:6px 14px;font-size:14.5px;cursor:pointer;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:5px;max-height:104px;overflow:auto;
  border:1px solid var(--rule2);border-radius:var(--r);padding:8px;background:#FAFBFB}
.chip{font-size:13.5px;background:#fff;border:1px solid var(--rule);border-radius:99px;padding:2px 8px;white-space:nowrap}
.chip.bad{border-color:#E0B6B0;background:var(--quiet-bg);color:var(--quiet)}
.hint{font-size:13.5px;color:var(--ink3);margin:8px 0 0}

/* meeting log view */
.log{max-width:820px;margin:0 auto;padding:30px 24px 70px}
.log .back{font-size:14.5px}
.log h1{font-size:26px;margin:14px 0 4px;letter-spacing:-.02em}
.log .meta{color:var(--ink2);font-size:14px;margin:0 0 20px}
.log .entry{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;margin-bottom:9px}
.log .entry.miss{background:#F7F7F6;border-style:dashed;color:var(--ink2)}
.log .entry h3{font-size:14.5px;display:flex;align-items:baseline;gap:9px}
.log .entry h3 .wk{font-weight:400;color:var(--ink3);font-size:14px;margin-left:auto}
.log .entry p{margin:6px 0 0;font-size:14.5px;color:var(--ink2)}

.note h3{font-size:14px;margin:0 0 6px}
.note p{margin:0 0 12px;font-size:14px;color:var(--ink2);line-height:1.55;max-width:66ch}
.note ol{margin:0 0 12px;padding-left:20px;font-size:14px;color:var(--ink2);line-height:1.55;max-width:66ch}
.note li{margin-bottom:7px}
.note .say{background:var(--met-bg);border-left:3px solid var(--met);padding:11px 14px;border-radius:0 var(--r) var(--r) 0;
  font-size:14.5px;color:var(--ink);margin:0 0 16px}
.note pre{background:#F4F6F5;border:1px solid var(--rule2);border-radius:var(--r);padding:11px 13px;
  font-family:"Courier New",Courier,monospace;font-size:14px;line-height:1.5;
  overflow-x:auto;color:var(--ink2);margin:0 0 12px}
/* GCG watermark: fixed, faint, behind everything */
#watermark{position:fixed;right:26px;bottom:60px;z-index:0;pointer-events:none;
  font-size:150px;line-height:1;font-weight:700;letter-spacing:-.05em;
  color:var(--ink);opacity:.035;user-select:none}
#app,#logview{position:relative;z-index:1}
.credit{border-top:1px solid var(--rule);margin-top:34px;padding:16px 0 6px;
  font-size:13.5px;color:var(--ink3);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.credit b{font-weight:700;color:var(--ink2)}
.credit .sep{color:var(--rule)}

/* metric explainers */
.info{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;
  margin-left:5px;border:1px solid var(--ink3);border-radius:50%;background:none;color:var(--ink3);
  font-size:11px;font-weight:700;line-height:1;cursor:pointer;padding:0;vertical-align:middle;
  font-family:"Times New Roman",Times,serif}
.info:hover{border-color:var(--ink);color:var(--ink)}
#tip{position:absolute;z-index:80;max-width:300px;background:var(--ink);color:#F1F3F2;
  padding:10px 13px;border-radius:var(--r);font-size:14px;line-height:1.45;
  box-shadow:0 8px 24px rgba(10,20,28,.3)}
#tip[hidden]{display:none}
#tip b{display:block;margin-bottom:3px;color:#fff}

/* add-contact form */
.form2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.form2 .full{grid-column:1 / -1}
.form2 label{display:block;font-size:14px;color:var(--ink2);margin-bottom:4px}
.form2 input,.form2 select{width:100%;border:1px solid var(--rule);border-radius:var(--r);
  padding:7px 9px;font-size:15px;background:#fff;font-family:inherit}
.form2 .err{border-color:var(--quiet)}
.formnote{font-size:13.5px;color:var(--ink3);margin:14px 0 0;line-height:1.5}
@media (max-width:620px){.form2{grid-template-columns:1fr}}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:var(--r);font-size:14.5px;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast[hidden]{display:none}
.sronly{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:860px){
  .week{grid-template-columns:1fr}
  .week-fig{border-right:0;border-bottom:1px solid var(--rule2)}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="app">
  <header class="masthead">
    <div class="wrap">
      <div class="brand">
        <h1>Discipleship Dashboard</h1>
        <p>Church at The Mill · Spartanburg County, SC</p>
      </div>
      <div class="mast-right">
        <span class="yearchip" id="yearchip"></span>
        <button class="btn ghost sm" id="btnAdd">Add people</button>
        <button class="btn ghost sm" id="btnReset">Clear data</button>
        <button class="btn ghost sm" id="btnImport">Import data</button>
        <button class="btn ghost sm" id="btnExportCsv">Export this tab (CSV)</button>
        <button class="btn ghost sm" id="btnExportJson">Export all (JSON)</button>
        <input type="file" id="fileInput" accept=".json,.csv" hidden>
      </div>
    </div>
  </header>

  <div class="shell">
    <aside class="sidenav" id="sidenav"></aside>
    <main class="content">
    <section class="view" id="view-overview"></section>
    <section class="view" id="view-details" hidden></section>
    <section class="view" id="view-leaders" hidden></section>
    <section class="view" id="view-disciples" hidden></section>
    <section class="view" id="view-available" hidden></section>

    <section class="view" id="view-sg-overview" hidden></section>

/* ---------- ministry calendar -------------------------------------
   Groups run the 2nd week of August through December, then January
   through May. Weeks containing Thanksgiving, Christmas, New Year's
   Day or Easter are not counted. DATA.weeks holds the resulting list;
   buildWeeks() regenerates it for any ministry year.               */
function easter(y){
  var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,
      f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
      h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,
      m=Math.floor((a+11*h+22*l)/451);
  return new Date(Date.UTC(y,Math.floor((h+l-7*m+114)/31)-1,((h+l-7*m+114)%31)+1));
}
function mondayOf(d){var x=new Date(d);var w=(x.getUTCDay()+6)%7;x.setUTCDate(x.getUTCDate()-w);return x;}
function iso(d){return d.toISOString().slice(0,10);}
function buildWeeks(y0){
  var y1=y0+1, aug1=new Date(Date.UTC(y0,7,1)), first=mondayOf(aug1);
  if(first<aug1) first=new Date(first.getTime()+6048e5);
  var fallStart=new Date(first.getTime()+6048e5);
  var springStart=mondayOf(new Date(Date.UTC(y1,0,1)));
  if(springStart<Date.UTC(y1,0,1)) springStart=new Date(springStart.getTime()+6048e5);
  var tg=new Date(Date.UTC(y0,10,1));
  tg.setUTCDate(tg.getUTCDate()+((4-tg.getUTCDay()+7)%7)+21);
  var skip={};
  [tg,new Date(Date.UTC(y0,11,25)),new Date(Date.UTC(y1,0,1)),easter(y1)]
    .forEach(function(d){skip[iso(mondayOf(d))]=1;});
  var out=[];
  [[fallStart,new Date(Date.UTC(y0,11,31)),"Fall"],
   [springStart,new Date(Date.UTC(y1,4,31)),"Spring"]].forEach(function(t){
    for(var d=new Date(t[0]); d.getTime()+5184e5<=t[1].getTime(); d=new Date(d.getTime()+6048e5)){
      if(!skip[iso(d)]) out.push({monday:iso(d),term:t[2]});
    }
  });
  return out;
}

/* ---------- derived model ----------------------------------------- */
var M = {};
function derive(){
  var weeks = DATA.weeks;
  var elapsed = weeks.filter(function(w){ return new Date(w.monday+"T12:00:00") <= TODAY; });
  var thisWeek = elapsed.length ? elapsed[elapsed.length-1].monday : weeks[0].monday;

  var byLeader = {};
  DATA.meetings.forEach(function(m){ (byLeader[m.leaderId]=byLeader[m.leaderId]||[]).push(m); });
  Object.keys(byLeader).forEach(function(k){
    byLeader[k].sort(function(a,b){ return a.date < b.date ? 1 : -1; });
  });

  var disByLeader = {};
  DATA.disciples.forEach(function(d){
    var withName = Object.assign({}, d, { name: d.first + " " + d.last });
    (disByLeader[d.leaderId] = disByLeader[d.leaderId] || []).push(withName);
  });
  Object.keys(disByLeader).forEach(function(k){
    disByLeader[k].sort(function(x,y){ return x.last < y.last ? -1 : 1; });
  });

  var leaders = DATA.leaders.map(function(l){
    var ms = byLeader[l.id] || [], ds = disByLeader[l.id] || [];
    var last = ms[0] || null;
    var weeksSince = null;
    if(last){
      var li = elapsed.map(function(w){return w.monday;}).indexOf(last.week);
      weeksSince = li < 0 ? null : (elapsed.length - 1 - li);
    }
    var metThisWeek = ms.some(function(m){ return m.week === thisWeek; });
    var startIdx = Math.max(0, elapsed.map(function(w){return w.monday;}).indexOf(l.startDate));
    var possible = l.status === "active" ? Math.max(1, elapsed.length - startIdx) : 0;
    return Object.assign({}, l, {
      name: l.first + " " + l.last,
      disciples: ds,
      discipleCount: ds.length,
      meetings: ms,
      totalMet: ms.length,
      lastMeeting: last,
      weeksSince: last ? weeksSince : (l.status === "active" ? elapsed.length : null),
      metThisWeek: metThisWeek,
      possibleToDate: possible,
      meetRate: possible ? ms.length / possible : 0,
      yearPace: elapsed.length ? ms.length / elapsed.length : 0,
      quiet: l.status === "active" && (!last || weeksSince === null || weeksSince >= QUIET_WEEKS)
    });
  });

  var active = leaders.filter(function(l){ return l.status === "active"; });
  var available = leaders.filter(function(l){ return l.status === "available"; });
  var idx = {}; leaders.forEach(function(l){ idx[l.id] = l; });

  var metCount = active.filter(function(l){ return l.metThisWeek; }).length;
  var ytdHeld = active.reduce(function(s,l){ return s + l.totalMet; }, 0);
  var ytdPoss = active.reduce(function(s,l){ return s + l.possibleToDate; }, 0);

  M = {
    weeks: weeks, elapsed: elapsed, thisWeek: thisWeek,
    weekNo: elapsed.length, weekTotal: weeks.length,
    leaders: leaders, active: active, available: available, idx: idx,
    disciples: DATA.disciples.map(function(d){
      var l = idx[d.leaderId] || {}, ms = l.meetings || [];
      var here = 0, missed = 0, lastHere = null;
      ms.forEach(function(m){
        if((m.present||[]).indexOf(d.id) >= 0){ here++; if(!lastHere || m.date > lastHere) lastHere = m.date; }
        else if((m.absent||[]).indexOf(d.id) >= 0){ missed++; }
      });
      var held = here + missed;
      return Object.assign({}, d, {
        name: d.first + " " + d.last, leaderName: l.name || "Unassigned",
        lastMeeting: l.lastMeeting || null, weeksSince: l.weeksSince,
        groupType: l.groupType || "", quiet: !!l.quiet,
        attended: here, missedCount: missed, groupHeld: held,
        attendRate: held ? here / held : 0, lastAttended: lastHere
      });
    }),
    possibleThisWeek: active.length,
    metThisWeek: metCount,
    weekPct: active.length ? metCount / active.length : 0,
    quietList: active.filter(function(l){ return l.quiet; })
                     .sort(function(a,b){ return (b.weeksSince||99)-(a.weeksSince||99); }),
    ytdPct: ytdPoss ? ytdHeld / ytdPoss : 0,
    ytdHeld: ytdHeld, ytdPoss: ytdPoss
  };
  M.quietPct = active.length ? M.quietList.length / active.length : 0;
}

function tipMark(key){

/* ---------- small helpers ------------------------------------------ */
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function pct(x){ return Math.round(x*100) + "%"; }
function fdate(s){
  if(!s) return "—";
  var d = new Date(s + "T12:00:00");
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
}
function fshort(s){
  if(!s) return "—";
  var d = new Date(s + "T12:00:00");
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
}
function gender(g){ return g === "M" ? "Male" : "Female"; }
function statusPill(l){
  if(l.status !== "active") return '<span class="tag">Available</span>';
  if(l.quiet) return '<span class="pill quiet">Quiet ' + (l.weeksSince||0) + ' wks</span>';
  if(l.metThisWeek) return '<span class="pill met">Met this week</span>';
  return '<span class="pill watch">' + (l.weeksSince===0?'Not yet':(l.weeksSince||1) + ' wk ago') + '</span>';
}
function toast(msg){
  var t = el("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.hidden = true; }, 2600);
}
function download(name, text, mime){
  var b = new Blob([text], {type: mime || "text/plain;charset=utf-8"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 400);
}

/* ---------- generic table ------------------------------------------ */
function sortRows(tab, rows, columns){
  var s = state.sort[tab]; if(!s) return rows;
  var c = columns.filter(function(x){ return x.key === s.key; })[0]; if(!c) return rows;
  return rows.slice().sort(function(a,b){
    var x=c.v(a), y=c.v(b);
    if(x<y) return -1*s.dir; if(x>y) return 1*s.dir; return 0;
  });
}
function table(tab, columns, rows){
  var s = state.sort[tab] || {};
  var sel = state.sel[tab] || (state.sel[tab] = new Set());
  var body = sortRows(tab, rows, columns).map(function(r){
    return '<tr data-id="'+r.id+'"'+(sel.has(r.id)?' class="sel"':'')+'>'
      + '<td class="chk"><input type="checkbox" data-id="'+r.id+'"'+(sel.has(r.id)?" checked":"")+' aria-label="Select '+esc(r.name)+'"></td>'
      + columns.map(function(c){ return c.h(r); }).join("") + '</tr>';
  }).join("");
  return '<table><thead><tr><th class="chk"><input type="checkbox" data-all="1" aria-label="Select all rows"></th>'
    + columns.map(function(c){
        var ar = s.key===c.key ? (s.dir===1?'&#9650;':'&#9660;') : '';
        var isNum = ["total","rate","yearpace","weeksq","attend","dpresent","dmissed"].indexOf(c.key) >= 0;
        return '<th class="'+(isNum?"n":"")+'"><span class="sortable" data-sort="'+c.key+'">'+esc(c.label)
          +'<span class="ar">'+ar+'</span></span>'+(c.tip?tipMark(c.tip):'')+'</th>';
      }).join("")
    + '</tr></thead><tbody>' + body + '</tbody></table>';
}
function wireTable(tab, rows, noteId, btnId){
  var root = document.querySelector('#view-'+(tab==="quiet"?"overview":tab)) || document;
  var sel = state.sel[tab] || (state.sel[tab] = new Set());
  var byId = {}; rows.forEach(function(r){ byId[r.id]=r; });

  function refresh(){
    if(noteId && el(noteId)) el(noteId).textContent = sel.size ? sel.size + " selected" : "";
    if(btnId && el(btnId)) el(btnId).disabled = sel.size === 0;
    root.querySelectorAll('tr[data-id]').forEach(function(tr){
      tr.classList.toggle("sel", sel.has(tr.dataset.id));
    });
  }
  root.querySelectorAll('[data-sort]').forEach(function(th){
    th.addEventListener("click", function(){
      var k = th.dataset.sort, cur = state.sort[tab];
      state.sort[tab] = (cur && cur.key===k) ? {key:k, dir:-cur.dir} : {key:k, dir:1};
      render();
    });
  });
  root.querySelectorAll('tbody input[type=checkbox]').forEach(function(cb){
    cb.addEventListener("change", function(){
      cb.checked ? sel.add(cb.dataset.id) : sel.delete(cb.dataset.id);
      refresh();
    });
  });
  var all = root.querySelector('th input[data-all]');
  if(all) all.addEventListener("change", function(){
    rows.forEach(function(r){ all.checked ? sel.add(r.id) : sel.delete(r.id); });
    root.querySelectorAll('tbody input[type=checkbox]').forEach(function(cb){ cb.checked = all.checked; });
    refresh();
  });
  if(btnId && el(btnId)) el(btnId).addEventListener("click", function(){
    openMessage(Array.from(sel).map(function(id){ return byId[id]; }).filter(Boolean));
  });
  refresh();
}

/* ---------- filter toolbar ------------------------------------------ */
function filtOf(tab){ return state.filt[tab] || (state.filt[tab] = {q:"",campus:"",groupType:"",gender:"",status:""}); }
function uniq(arr,k){ var s={}; arr.forEach(function(x){ if(x[k]) s[x[k]]=1; }); return Object.keys(s).sort(); }
function applyFilter(tab, rows){
  var f = filtOf(tab);
  return rows.filter(function(r){
    if(f.campus && r.campus !== f.campus) return false;
    if(f.groupType && r.groupType !== f.groupType) return false;
    if(f.gender && r.gender !== f.gender) return false;
    if(f.status){
      if(f.status==="quiet" && !r.quiet) return false;
      if(f.status==="met" && !r.metThisWeek) return false;
      if(f.status==="pending" && (r.quiet || r.metThisWeek)) return false;
    }
    if(f.q){
      var hay = (r.name+" "+(r.leaderName||"")+" "+(r.email||"")+" "
        +(r.disciples?r.disciples.map(function(d){return d.name;}).join(" "):"")).toLowerCase();
      if(hay.indexOf(f.q.toLowerCase()) < 0) return false;
    }
    return true;
  });
}
function toolbar(tab, pool, opts){
  var f = filtOf(tab);
  function sel(name, label, vals, cur, disp){
    return '<select data-f="'+name+'" aria-label="'+label+'"><option value="">'+label+': all</option>'
      + vals.map(function(v){ return '<option value="'+esc(v)+'"'+(cur===v?" selected":"")+'>'
          +esc(disp?disp(v):v)+'</option>'; }).join("") + '</select>';
  }
  var h = '<div class="tools"><input type="search" data-f="q" value="'+esc(f.q)+'" placeholder="Search names or email">'
    + sel("campus","Campus",uniq(pool,"campus"),f.campus)
    + sel("groupType","Group type",uniq(pool,"groupType"),f.groupType)
    + sel("gender","Gender",["M","F"],f.gender,gender);
  if(opts && opts.status)
    h += sel("status","Status",["met","pending","quiet"],f.status,function(v){
      return v==="met"?"Met this week":v==="pending"?"Awaiting report":"Quiet "+QUIET_WEEKS+"+ weeks"; });
  h += '<span class="selnote" id="'+tab+'-note"></span>'
    + '<button class="btn primary" id="'+tab+'-msg" disabled>Message selected</button></div>';
  return h;
}
function wireToolbar(tab){
  var root = el('view-'+tab); if(!root) return;
  root.querySelectorAll('[data-f]').forEach(function(c){
    c.addEventListener(c.tagName==="SELECT" ? "change" : "input", function(){
      filtOf(tab)[c.dataset.f] = c.value;
      render();
      var again = el('view-'+tab).querySelector('[data-f="'+c.dataset.f+'"]');
      if(again && c.dataset.f==="q"){ again.focus(); again.setSelectionRange(again.value.length,again.value.length); }
    });
  });
}

/* ---------- roster views -------------------------------------------- */
function renderRoster(tab, title, note, pool, columns, opts){
  var rows = applyFilter(tab, pool);
  el('view-'+tab).innerHTML =
    '<div class="panel"><div class="panel-hd"><h2>'+esc(title)+'</h2><p>'+esc(note)+'</p></div>'
    + toolbar(tab, pool, opts)

       ? '<div class="tscroll">' + table(tab, columns, rows) + '</div>'
       : '<div class="empty"><b>Nothing matches those filters.</b>Clear the search or widen a filter to see records again.</div>')
    + '</div>';
  wireToolbar(tab);
  wireTable(tab, rows, tab+"-note", tab+"-msg");
}

function csvCell(v){ v = v==null ? "" : String(v);
  return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }
function toCsv(rows){ return rows.map(function(r){ return r.map(csvCell).join(","); }).join("\r\n"); }
function parseCsv(text){
  var rows=[], row=[], cur="", q=false;
  text = text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(cur); cur=""; }
    else if(c==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
    else cur+=c;
  }
  if(cur!=="" || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(function(r){ return r.length>1 || r[0]!==""; });
}

function importFile(file){
  var r = new FileReader();
  r.onload = function(){
    try{
      if(/\.json$/i.test(file.name)){
        var d = JSON.parse(r.result);
        if(d.smallGroups || d.discipleship){
          if(d.smallGroups) SG = d.smallGroups;
          if(d.discipleship) DATA = d.discipleship;
          state.sel = {}; render();
          toast("Loaded both modules"); return;
        }
        if(d.groups && d.people){ SG = d; state.sel = {}; render();
          toast("Loaded " + d.people.length + " group members"); return; }
        if(!d.leaders || !d.disciples) throw new Error("JSON needs leaders and disciples arrays.");
        DATA = d;
        DATA.weeks = DATA.weeks && DATA.weeks.length ? DATA.weeks : buildWeeks(new Date(DATA.meta.generated).getUTCFullYear());
        TODAY = new Date((DATA.meta.generated || iso(new Date())) + "T12:00:00");
        state.sel = {}; render();
        toast("Loaded " + DATA.leaders.length + " leaders and " + DATA.disciples.length + " disciples");
      } else {
        var rows = parseCsv(r.result);
        if(rows.length < 2) throw new Error("That CSV has no data rows.");
        var head = rows[0].map(function(h){ return h.trim().toLowerCase(); });
        var recs = rows.slice(1).map(function(rw){
          var o={}; head.forEach(function(h,i){ o[h]=(rw[i]||"").trim(); }); return o; });
        if(head.indexOf("leaderid")>=0 && (head.indexOf("date")>=0 || head.indexOf("week")>=0)){
          DATA.meetings = recs.map(function(o,i){
            var d = o.date || o.week;
            return {id:o.id||("M"+(9000+i)), leaderId:o.leaderid, week:o.week||iso(mondayOf(new Date(d+"T12:00:00"))),
              date:d, present:(o.present||"").split(/[;|]/).filter(Boolean),
              absent:(o.absent||"").split(/[;|]/).filter(Boolean), note:o.note||""};
          });
          toast("Loaded " + DATA.meetings.length + " attendance records");
        } else if(head.indexOf("leaderid")>=0){
          DATA.disciples = recs.map(function(o,i){ return {id:o.id||("D"+(900+i)),
            first:o.first||(o.name||"").split(" ")[0]||"", last:o.last||(o.name||"").split(" ").slice(1).join(" "),
            gender:(o.gender||"M").toUpperCase()[0]==="F"?"F":"M", email:o.email||"", phone:o.phone||"",
            leaderId:o.leaderid, campus:o.campus||"", startDate:o.startdate||o["start date"]||""}; });
          toast("Loaded " + DATA.disciples.length + " disciples");
        } else {
          DATA.leaders = recs.map(function(o,i){ return {id:o.id||("L"+(900+i)),
            first:o.first||(o.name||"").split(" ")[0]||"", last:o.last||(o.name||"").split(" ").slice(1).join(" "),
            gender:(o.gender||"M").toUpperCase()[0]==="F"?"F":"M", email:o.email||"", phone:o.phone||"",
            campus:o.campus||"", groupType:o.grouptype||o["group type"]||"Small Group",
            status:(o.status||"active").toLowerCase(), startDate:o.startdate||o["start date"]||"",
            trainedOn:o.trained||o.trainedon||""}; });
          toast("Loaded " + DATA.leaders.length + " leaders");
        }
        state.sel = {}; render();
      }
    } catch(e){
      toast("Import failed: " + e.message);
    }
  };
  r.readAsText(file);
}

document.addEventListener("click", function(e){
  var mb = e.target.closest("[data-module]");
  if(mb){
    var m = MODULES.filter(function(x){ return x.id === mb.dataset.module; })[0];
    if(m){ state.tab = m.tabs[0].id; render(); window.scrollTo(0,0); }
    return;
  }
  var t = e.target.closest("[data-tab]");
  if(t){ state.tab = t.dataset.tab; render(); }
});
el("btnAdd").addEventListener("click", function(){
  el("addScrim").hidden = false; paintAdd();
});
el("addClose").addEventListener("click", function(){ el("addScrim").hidden = true; });
el("addScrim").addEventListener("click", function(e){ if(e.target === this) el("addScrim").hidden = true; });
el("addKind").addEventListener("click", function(e){
  var b = e.target.closest("[data-kind]"); if(!b) return;
  addKind = b.dataset.kind; paintAdd();
});
el("addSave").addEventListener("click", function(){ saveAdd(false); });
el("addAnother").addEventListener("click", function(){ saveAdd(true); });

document.addEventListener("click", function(e){
  var b = e.target.closest(".info");
  if(b){ e.stopPropagation(); (showTip.open === b) ? hideTip() : showTip(b); return; }
  if(!e.target.closest("#tip")) hideTip();
});
window.addEventListener("resize", hideTip);
window.addEventListener("scroll", hideTip, true);

el("btnImport").addEventListener("click", function(){ el("fileInput").click(); });
el("fileInput").addEventListener("change", function(){
  if(this.files[0]) importFile(this.files[0]); this.value = "";
});
el("btnExportCsv").addEventListener("click", exportCsv);
el("btnReset").addEventListener("click", confirmClear);
el("btnExportJson").addEventListener("click", exportJson);
el("msgClose").addEventListener("click", closeMessage);
el("msgScrim").addEventListener("click", function(e){ if(e.target === this) closeMessage(); });
document.addEventListener("keydown", function(e){
  if(e.key !== "Escape") return;
  if(!el("tip").hidden) hideTip();
  else if(!el("noteScrim").hidden) closeNote();
  else if(!el("addScrim").hidden) el("addScrim").hidden = true;
  else closeMessage();
});
el("msgChannel").addEventListener("click", function(e){
  var b = e.target.closest("[data-ch]"); if(!b) return;
  state.msg.channel = b.dataset.ch; paintMessage();
});
el("msgCopy").addEventListener("click", copyRecipients);
el("msgSend").addEventListener("click", function(){
  var to = msgRecipients();
  if(!to.length){ toast("No one in this selection has contact details on file."); return; }
  if(state.msg.channel === "text"){ explainTexting(); return; }
  if(to.length > MAILTO_MAX){ explainMailtoLimit(to.length); return; }
  window.location.href = "mailto:?bcc=" + encodeURIComponent(to.join(","))
    + "&subject=" + encodeURIComponent(el("msgSubject").value)
    + "&body=" + encodeURIComponent(el("msgBody").value);
});
el("noteClose").addEventListener("click", closeNote);
el("noteDismiss").addEventListener("click", closeNote);
el("noteScrim").addEventListener("click", function(e){ if(e.target === this) closeNote(); });

var SG = JSON.parse(JSON.stringify(SGSEED));

var BANDS = [
  {key:"committed", lo:.85, label:"85% and up",  cls:"b-thriving", note:"Committed"},
  {key:"goal",      lo:.70, label:"70 to 84%",   cls:"b-steady",   note:"Meeting the goal"},
  {key:"partial",   lo:.50, label:"50 to 69%",   cls:"b-watch",    note:"Partial"},
  {key:"drifting",  lo:.25, label:"25 to 49%",   cls:"b-risk",     note:"Drifting"},
  {key:"disengaged",lo:0,   label:"Under 25%",   cls:"b-risk",     note:"Disengaged"}
];
function bandOf(r){ for(var i=0;i<BANDS.length;i++) if(r >= BANDS[i].lo) return BANDS[i]; return BANDS[4]; }

/* ---------- group health index -------------------------------------
   Four weighted parts. Attendance is the core signal; consistency
   separates "meets faithfully, lightly attended" from "keeps skipping";
   direction catches decline before it is obvious; size flags groups
   that are about to fold or have stopped being small.               */
function healthOf(g, roster){
  var held = g.weeks.filter(function(x){ return x >= 0; });
  var poss = g.weeks.length || 1;
  var consistency = held.length / poss;
  var avg = held.length ? held.reduce(function(a,b){return a+b;},0) / held.length : 0;
  var attendRate = roster ? Math.min(1, avg / roster) : 0;

  var half = Math.floor(held.length/2), early = held.slice(0,half), late = held.slice(half);
  function mean(a){ return a.length ? a.reduce(function(x,y){return x+y;},0)/a.length : 0; }
  var drift = roster && half ? (mean(late) - mean(early)) / roster : 0;
  var dirScore = Math.max(0, Math.min(1, 0.5 + drift*2.5));

  var n = roster, sizeScore = (n >= 6 && n <= 16) ? 1
        : (n < 6 ? n/6 : Math.max(.4, 16/n));

  var score = Math.round(100 * (0.40*attendRate + 0.25*consistency + 0.20*dirScore + 0.15*sizeScore));
  var band = score >= 75 ? ["Thriving","b-thriving"]
           : score >= 60 ? ["Steady","b-steady"]
           : score >= 45 ? ["Watch","b-watch"] : ["At risk","b-risk"];
  return { score:score, band:band[0], cls:band[1], attendRate:attendRate,
           consistency:consistency, drift:drift, avg:avg, held:held.length, poss:poss, sizeScore:sizeScore };
}

function sgDerive(){
  var meta = SG.meta;
  var byGroup = {};
  SG.groups.forEach(function(g){ byGroup[g.id] = g; });

  var people = SG.people.map(function(p){
    var seen = 0, here = 0;
    for(var i=0;i<p.att.length;i++){
      if(p.att[i] === "-") continue;
      seen++; if(p.att[i] === "1") here++;
    }
    var rate = seen ? here/seen : 0;
    var half = Math.floor(p.att.length/2);
    function part(s){
      var t=0,c=0; for(var i=0;i<s.length;i++){ if(s[i]==="-")continue; t++; if(s[i]==="1")c++; }
      return t ? c/t : null;
    }
    var early = part(p.att.slice(0,half)), late = part(p.att.slice(half));
    var g = byGroup[p.groupId] || {};
    return Object.assign({}, p, {
      name: p.first + " " + p.last, groupName: g.name || "Unassigned",
      attended: here, possible: seen, rate: rate, band: bandOf(rate),
      dir: (early == null || late == null) ? 0 : (late - early),
      yoy: rate - (p.prevRate || 0),
      day: g.day || "", leaderName: g.leader || ""
    });
  });

  var rosterOf = {};
  people.forEach(function(p){ rosterOf[p.groupId] = (rosterOf[p.groupId]||0) + 1; });

  var groups = SG.groups.map(function(g){
    var roster = rosterOf[g.id] || g.roster;
    var h = healthOf(g, roster);
    var mine = people.filter(function(p){ return p.groupId === g.id; });
    var at70 = mine.filter(function(p){ return p.rate >= meta.threshold; }).length;
    return Object.assign({}, g, h, {
      roster: roster, at70: at70,
      at70Pct: roster ? at70/roster : 0,
      lastCount: g.weeks.length ? g.weeks[g.weeks.length-1] : -1
    });
  });

  var denomTotal = sgState.denom === "members" ? meta.membersTotal : meta.attendersTotal;
  var adultTotal = sgState.denom === "members" ? meta.adultMembers : meta.adultAttenders;
  // The same people are counted either way. Only the denominator moves:
  // the rolls say one thing, the on-the-ground attender count says another.
  var assigned = people.length;
  var at70 = people.filter(function(p){ return p.rate >= meta.threshold; }).length;

  var counts = {};
  BANDS.forEach(function(b){ counts[b.key] = {now:0, prev:0}; });
  people.forEach(function(p){
    counts[p.band.key].now++;
    counts[bandOf(p.prevRate||0).key].prev++;
  });

  S = {
    meta: meta, people: people, groups: groups,
    denomTotal: denomTotal, adultTotal: adultTotal,
    assigned: assigned, at70: at70,
    pctAssigned: denomTotal ? assigned/denomTotal : 0,
    pctAdults: adultTotal ? assigned/adultTotal : 0,
    pct70OfAssigned: assigned ? at70/assigned : 0,
    pct70OfAll: denomTotal ? at70/denomTotal : 0,
    bandCounts: counts,
    history: SG.history,
    goalHead: Math.round(meta.goalPct * meta.membersTotal),
    weekNo: (SG.weeks||[]).filter(function(w){ return w.monday <= meta.generated; }).length,
    weekTotal: (SG.weeks||[]).length
  };
  S.atRisk = groups.filter(function(g){ return g.score < 45; });
  S.avgScore = groups.length
    ? Math.round(groups.reduce(function(a,g){return a+g.score;},0)/groups.length) : 0;
}

function svgLine(opt){
  var W = 940, H = 330, L = 62, R = 18, T = 18, B = 42;
  var xs = opt.labels.length, iw = W-L-R, ih = H-T-B;
  var all = [];
  opt.series.forEach(function(s){ s.data.forEach(function(v){ if(v!=null) all.push(v); }); });
  if(opt.goal != null) all.push(opt.goal);
  var mx = Math.max.apply(null, all), mn = opt.zero ? 0 : Math.min.apply(null, all);
  var pad = (mx-mn)*0.10 || 1; mx += pad; if(!opt.zero) mn = Math.max(0, mn - pad);
  function X(i){ return L + (xs<2?iw/2:(i/(xs-1))*iw); }
  function Y(v){ return T + ih - ((v-mn)/(mx-mn))*ih; }

  var g = '', ticks = 5;
  for(var t=0;t<=ticks;t++){
    var v = mn + (mx-mn)*t/ticks, y = Y(v);
    g += '<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="var(--rule2)" stroke-width="1"/>'
       + '<text x="'+(L-9)+'" y="'+(y+5)+'" text-anchor="end" font-size="13" fill="var(--ink3)">'
       + esc(opt.fmt ? opt.fmt(v) : Math.round(v).toLocaleString()) + '</text>';
  }
  var step = Math.ceil(xs/9);
  opt.labels.forEach(function(lb,i){
    if(i % step && i !== xs-1) return;
    g += '<text x="'+X(i)+'" y="'+(H-14)+'" text-anchor="middle" font-size="13" fill="var(--ink3)">'+esc(lb)+'</text>';
  });
  if(opt.goal != null){
    g += '<line x1="'+L+'" y1="'+Y(opt.goal)+'" x2="'+(W-R)+'" y2="'+Y(opt.goal)
       + '" stroke="var(--watch)" stroke-width="2" stroke-dasharray="7 5"/>'
       + '<text x="'+(W-R)+'" y="'+(Y(opt.goal)-8)+'" text-anchor="end" font-size="13" font-weight="700" '
       + 'fill="var(--watch)">'+esc(opt.goalLabel||"Goal")+'</text>';
  }
  opt.series.forEach(function(s){
    var d = '', started = false;
    s.data.forEach(function(v,i){
      if(v == null) return;
      d += (started ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' ';
      started = true;
    });
    g += '<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="'+(s.width||2.5)
       + '" stroke-linejoin="round"'+(s.dash?' stroke-dasharray="7 5"':'')+'/>';
    var last = null; s.data.forEach(function(v,i){ if(v!=null) last = i; });
    if(last != null && !s.dash)
      g += '<circle cx="'+X(last)+'" cy="'+Y(s.data[last])+'" r="4" fill="'+s.color+'"/>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.title||"chart")+'">'+g+'</svg>';
}
function svgBars(opt){
  var W = 940, H = 330, L = 62, R = 18, T = 18, B = 52;
  var iw = W-L-R, ih = H-T-B, n = opt.labels.length;

  var mx = 0;
  series.forEach(function(s){ s.data.forEach(function(v){ if(v>mx) mx = v; }); });
  mx = mx*1.12 || 1;

  var g = '';

    var v = mx*t/4, y = Y(v);
    g += '<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="var(--rule2)"/>'
       + '<text x="'+(L-9)+'" y="'+(y+5)+'" text-anchor="end" font-size="13" fill="var(--ink3)">'
       + esc(opt.fmt ? opt.fmt(v) : Math.round(v).toLocaleString())+'</text>';

    var cx = L + sw*i + sw/2;

    });
    g += '<text x="'+cx+'" y="'+(H-30)+'" text-anchor="middle" font-size="13.5" fill="var(--ink2)">'+esc(lb)+'</text>';
    if(opt.sublabels && opt.sublabels[i])
      g += '<text x="'+cx+'" y="'+(H-13)+'" text-anchor="middle" font-size="12.5" fill="var(--ink3)">'
         + esc(opt.sublabels[i])+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.title||"chart")+'">'+g+'</svg>';
}
function legend(items){
  return '<div class="clegend">' + items.map(function(i){
    return '<span><i class="'+(i.dash?"dash":"")+'" style="'+(i.dash?"":"background:"+i.color)+'"></i>'
      + esc(i.label)+'</span>'; }).join("") + '</div>';
}

/* ---------- views --------------------------------------------------- */
function denomToggle(){
  return '<div class="toggle" id="sg-denom">'
    + '<button type="button" data-d="members" aria-pressed="'+(sgState.denom==="members")+'">Membership rolls</button>'
    + '<button type="button" data-d="attenders" aria-pressed="'+(sgState.denom==="attenders")+'">Regular attenders</button>'
    + '</div>';
}
function fstep(v, label, denom, note){
  var p = denom ? v/denom : 0;
  return '<div class="fstep"><div class="fill" style="width:'+(p*100)+'%"></div>'
    + '<div class="row"><span class="v">'+v.toLocaleString()+'</span>'
    + '<span class="l">'+label+(note||'')+'</span>'
    + '<span class="p">'+pct(p)+'</span></div></div>';
}
function drop(from, to, why){
  var lost = from - to;
  return '<div class="fdrop"><b>&darr; '+lost.toLocaleString()+' lost here</b><span class="why">'+esc(why)+'</span></div>';
}
function renderSgOverview(){
  var m = S.meta, isMem = sgState.denom === "members";
  var lbl = isMem ? "church members" : "regular attenders";
  var goalGap = S.goalHead - S.assigned;

  el("view-sg-overview").innerHTML =
    '<div class="panel"><div class="panel-hd"><h2>Where the church stands</h2>'
    + '<p>Ministry year '+esc(m.ministryYear)+' &middot; week '+S.weekNo+' of '+S.weekTotal+'</p>'
    + '<div class="sp">'+denomToggle()+'</div></div>'
    + '<div class="chartwrap"><div class="funnel">'
      + fstep(S.denomTotal, "total "+lbl, S.denomTotal)
      + drop(S.denomTotal, S.adultTotal, "children and students")
      + fstep(S.adultTotal, "adult "+lbl, S.denomTotal,
              ' <span class="estimate">estimate, needs their real figure</span>')
      + drop(S.adultTotal, S.assigned, "adults not assigned to any group: an assimilation gap")
      + fstep(S.assigned, "assigned to a small group", S.denomTotal)
      + drop(S.assigned, S.at70, "assigned but attending under "+pct(m.threshold)+": a retention gap")
      + fstep(S.at70, "attending "+pct(m.threshold)+" or more", S.denomTotal)
    + '</div>'
    + '<p class="readout">The two drops are different problems with different fixes. '
      + '<b>'+(S.adultTotal - S.assigned).toLocaleString()+'</b> adults are not in a group at all, which is about '
      + 'getting people connected. <b>'+(S.assigned - S.at70).toLocaleString()+'</b> are on a roster but not really '
      + 'showing up, which is about groups holding the people they already have. A single participation number '
      + 'hides which of the two you actually have.</p></div></div>'

    + '<div class="stats">'
      + stat(pct(S.pctAssigned), "In a small group", S.assigned.toLocaleString()+" of "+S.denomTotal.toLocaleString()+" "+lbl)
      + stat(pct(m.goalPct), "Goal by "+m.goalYear,
             (goalGap > 0 ? goalGap.toLocaleString()+" more people needed" : "goal met"), goalGap > 0)
      + stat(pct(S.pct70OfAssigned), "Of those, attending "+pct(m.threshold)+"+",
             S.at70.toLocaleString()+" people")
      + stat(S.groups.length.toLocaleString(), "Active groups",
             S.atRisk.length+" at risk &middot; average health "+S.avgScore)
    + '</div>'

    + '<div class="panel"><div class="panel-hd"><h2>Engagement bands</h2>'
      + '<p>Where every group member sits, and which way they moved against last year</p></div>'
      + '<div class="tscroll"><table><thead><tr>'
        + '<th>Attendance band</th><th></th><th class="n">This year</th><th class="n">Last year</th>'
        + '<th class="n">Change</th><th class="n">Share</th></tr></thead><tbody>'
      + BANDS.map(function(b){
          var c = S.bandCounts[b.key], d = c.now - c.prev;
          return '<tr><td class="name">'+esc(b.label)+'</td>'
            + '<td><span class="band '+b.cls+'">'+esc(b.note)+'</span></td>'
            + '<td class="n">'+c.now.toLocaleString()+'</td><td class="n">'+c.prev.toLocaleString()+'</td>'
            + '<td class="n"><span class="dir '+(d>0?"up":d<0?"down":"flat")+'">'
              + (d>0?"&uarr; +":d<0?"&darr; ":"")+(d===0?"no change":Math.abs(d).toLocaleString())+'</span></td>'
            + '<td class="n">'+pct(c.now/Math.max(1,S.people.length))+'</td></tr>';
        }).join("")
      + '</tbody></table></div>'
      + '<p class="readout">Cut lines hide direction on their own: somebody at 68% climbing and somebody at 72% '
        + 'sliding land in opposite rows while telling you the same story. The change column is what separates them.</p>'
    + '</div>'

    + '<div class="panel"><div class="panel-hd"><h2>Groups most at risk</h2>'
      + '<p>Lowest health scores &middot; these fold first if nobody intervenes</p></div>'
      + '<div class="tscroll">' + sgGroupTable(S.groups.slice().sort(function(a,b){ return a.score-b.score; }).slice(0,10)) + '</div>'
    + '</div>';

  wireDenom();
}

function chartFor(kind){
  var m = S.meta, hist = S.history;
  var labels = hist.map(function(h){
    var p = h.month.split("-");
    return (p[1]==="01" ? p[0] : ["","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+p[1]]);
  });

  if(kind === "participation"){
    var series = hist.map(function(h){
      return h.assigned / (sgState.denom === "members" ? h.members : h.attenders) * 100; });
    // straight-line projection from the last 24 months, extended to the goal year
    var k = Math.min(24, series.length), a = series[series.length-k], b = series[series.length-1];
    var slope = (b-a)/(k-1), monthsOut = (m.goalYear - 2026)*12 + 3;
    var proj = series.slice(), pad = [];
    for(var i=0;i<series.length-1;i++) pad.push(null);
    pad.push(b);
    var projLabels = labels.slice();
    for(var j=1;j<=monthsOut;j++){
      pad.push(Math.max(0, b + slope*j));
      projLabels.push(j % 12 === (12 - 9) % 12 ? String(2026 + Math.ceil((j+9)/12)) : "");
      proj.push(null);
    }
    return {
      svg: svgLine({ labels: projLabels, zero:false, fmt:function(v){ return Math.round(v)+"%"; },
        goal: m.goalPct*100, goalLabel: pct(m.goalPct)+" by "+m.goalYear,
        series: [ {data: proj, color:"var(--link)"},
                  {data: pad,  color:"var(--ink3)", dash:true, width:2} ] }),
      legend: legend([{label:"Share in a small group", color:"var(--link)"},
                      {label:"If the current trend holds", color:"var(--ink3)", dash:true},
                      {label:"Goal", dash:true}]),
      read: (function(){
        var now = series[series.length-1], need = m.goalPct*100;
        var monthsNeeded = slope > 0 ? Math.ceil((need-now)/slope) : null;
        var hit = monthsNeeded != null ? new Date(2026, 8+monthsNeeded, 1) : null;
        return 'Participation is at <b>'+now.toFixed(1)+'%</b> and moving about <b>'
          + (slope*12).toFixed(1)+' points a year</b>. '
          + (slope <= 0 ? 'At a flat or falling rate the goal is not reachable without changing something.'
             : 'Holding that pace reaches '+pct(m.goalPct)+' around <b>'
               + hit.toLocaleDateString("en-US",{month:"long",year:"numeric"})+'</b>, which is '
               + (hit.getFullYear() <= m.goalYear ? 'inside' : 'past') + ' the '+m.goalYear+' target. '
               + 'The dashed line is arithmetic on the last two years, not a forecast: it assumes nothing changes.');
      })()
    };
  }
  if(kind === "headcount"){
    return {
      svg: svgLine({ labels: labels, zero:true,
        series:[ {data: hist.map(function(h){return h.members;}), color:"var(--ink2)"},
                 {data: hist.map(function(h){return h.attenders;}), color:"var(--watch)"},
                 {data: hist.map(function(h){return h.assigned;}), color:"var(--link)"},
                 {data: hist.map(function(h){return h.active70;}), color:"var(--met)"} ] }),
      legend: legend([{label:"Members on the rolls", color:"var(--ink2)"},
                      {label:"Regular attenders", color:"var(--watch)"},
                      {label:"In a small group", color:"var(--link)"},
                      {label:"Attending 70%+", color:"var(--met)"}]),
      read: 'Raw headcounts rather than ratios. When the membership line climbs faster than the small group '
          + 'line, participation falls even though more people are in groups than ever. That is the single most '
          + 'common way a growing church quietly loses ground on connection.'
    };
  }
  if(kind === "bands"){
    return {
      svg: svgBars({ labels: BANDS.map(function(b){return b.note;}),
        sublabels: BANDS.map(function(b){return b.label;}), valueLabels:true,
        series:[ {data: BANDS.map(function(b){return S.bandCounts[b.key].prev;}), color:"#B9C4C0"},
                 {data: BANDS.map(function(b){return S.bandCounts[b.key].now;}), color:"var(--link)"} ] }),
      legend: legend([{label:"Last year", color:"#B9C4C0"},{label:"This year", color:"var(--link)"}]),
      read: 'The shape matters more than any single bar. Weight shifting left means people are deepening their '
          + 'commitment; weight shifting right means groups are holding names rather than people.'
    };
  }
  // by campus
  var camps = uniq(S.people, "campus");
  var assignedBy = camps.map(function(c){
    return S.people.filter(function(p){ return p.campus === c; }).length; });
  var at70By = camps.map(function(c){
    return S.people.filter(function(p){ return p.campus === c && p.rate >= S.meta.threshold; }).length; });
  return {
    svg: svgBars({ labels: camps, valueLabels:true,
      series:[ {data: assignedBy, color:"var(--link)"}, {data: at70By, color:"var(--met)"} ] }),
    legend: legend([{label:"In a small group", color:"var(--link)"},
                    {label:"Attending 70%+", color:"var(--met)"}]),
    read: 'Campus totals track campus size, so read the gap between the two bars rather than their height. '
        + 'A campus where the green bar is a small fraction of the blue has a retention problem that a '
        + 'church-wide average will bury.'
  };
}
function renderSgTrends(){
  var opts = [["participation","Pace to the goal"],["headcount","Headcounts"],
              ["bands","Engagement bands"],["campus","By campus"]];
  var c = chartFor(sgState.chart);
  el("view-sg-trends").innerHTML =
    '<div class="panel"><div class="panel-hd"><h2>Trends</h2>'
    + '<p>Historical, present and projected</p>'
    + '<div class="sp"><div class="toggle" id="sg-chart">'
      + opts.map(function(o){
          return '<button type="button" data-c="'+o[0]+'" aria-pressed="'+(sgState.chart===o[0])+'">'
            + esc(o[1])+'</button>'; }).join("")
      + '</div>' + denomToggle() + '</div></div>'
    + '<div class="chartwrap">' + c.svg + c.legend + '</div>'
    + '<p class="readout">' + c.read + '</p></div>';
  wireDenom();
  el("sg-chart").addEventListener("click", function(e){
    var b = e.target.closest("[data-c]"); if(!b) return;
    sgState.chart = b.dataset.c; render();
  });
}
function wireDenom(){
  document.querySelectorAll("#sg-denom").forEach(function(t){
    t.addEventListener("click", function(e){
      var b = e.target.closest("[data-d]"); if(!b) return;
      sgState.denom = b.dataset.d; render();
    });
  });
}

function sgGroupTable(rows){
  return '<table><thead><tr>'
    + '<th><span class="sortable" data-sort="score">Health</span>'+tipMark("health")+'</th>'
    + '<th>Group</th><th>Leader</th><th>Meets</th>'
    + '<th class="n">Roster</th><th class="n">Avg present</th>'
    + '<th class="n">Attendance</th><th class="n">Consistency</th><th class="n">Direction</th>'
    + '<th class="n">At 70%+</th><th>Campus</th></tr></thead><tbody>'
    + rows.map(function(g){
        var d = g.drift;
        return '<tr><td><span class="hscore"><span class="n">'+g.score+'</span>'
          + '<span class="band '+g.cls+'">'+esc(g.band)+'</span></span></td>'
          + '<td class="name">'+esc(g.name)+'</td><td class="sub">'+esc(g.leader)+'</td>'
          + '<td class="sub">'+esc(g.day+" "+g.time)+'</td>'
          + '<td class="n">'+g.roster+'</td><td class="n">'+g.avg.toFixed(1)+'</td>'
          + '<td class="n">'+pct(g.attendRate)+'</td>'
          + '<td class="n">'+g.held+' of '+g.poss+'</td>'
          + '<td class="n"><span class="dir '+(d>.02?"up":d<-.02?"down":"flat")+'">'
            + (d>.02?"&uarr;":d<-.02?"&darr;":"&ndash;")+' '+(Math.abs(d)<.005?"":pct(Math.abs(d)))+'</span></td>'
          + '<td class="n">'+g.at70+' of '+g.roster+'</td>'
          + '<td class="sub">'+esc(g.campus)+'</td></tr>';
      }).join("")
    + '</tbody></table>';
}
function renderSgGroups(){
  var f = filtOf("sg-groups");
  var rows = S.groups.filter(function(g){
    if(f.campus && g.campus !== f.campus) return false;
    if(f.gender && f.gender !== "") { /* not applicable to groups */ }
    if(f.q){
      var hay = (g.name+" "+g.leader+" "+g.campus).toLowerCase();
      if(hay.indexOf(f.q.toLowerCase()) < 0) return false;
    }
    if(f.status === "risk" && g.score >= 45) return false;
    if(f.status === "watch" && !(g.score >= 45 && g.score < 60)) return false;
    if(f.status === "healthy" && g.score < 60) return false;
    return true;
  });
  var s = state.sort["sg-groups"];
  if(s) rows = rows.slice().sort(function(a,b){ return (a.score-b.score)*s.dir; });
  else  rows = rows.slice().sort(function(a,b){ return a.score-b.score; });

  el("view-sg-groups").innerHTML =
    '<div class="panel"><div class="panel-hd"><h2>Group health</h2>'
    + '<p>'+S.groups.length+' groups &middot; worst first &middot; average score '+S.avgScore+'</p></div>'
    + '<div class="tools">'
      + '<input type="search" data-f="q" value="'+esc(f.q)+'" placeholder="Search group or leader">'
      + '<select data-f="campus"><option value="">Campus: all</option>'
        + uniq(S.groups,"campus").map(function(c){
            return '<option value="'+esc(c)+'"'+(f.campus===c?" selected":"")+'>'+esc(c)+'</option>'; }).join("")
      + '</select>'
      + '<select data-f="status"><option value="">Health: all</option>'
        + [["risk","At risk"],["watch","Watch"],["healthy","Steady or thriving"]].map(function(o){
            return '<option value="'+o[0]+'"'+(f.status===o[0]?" selected":"")+'>'+esc(o[1])+'</option>'; }).join("")
      + '</select>'
      + '<span class="selnote">'+rows.length+' shown</span></div>'
    + (rows.length ? '<div class="tscroll">'+sgGroupTable(rows)+'</div>'
       : '<div class="empty"><b>Nothing matches those filters.</b>Widen a filter to see groups again.</div>')
    + '</div>';
  wireSgFilters("sg-groups");
  el("view-sg-groups").querySelectorAll("[data-sort]").forEach(function(th){
    th.addEventListener("click", function(){
      var cur = state.sort["sg-groups"];
      state.sort["sg-groups"] = {key:"score", dir: cur ? -cur.dir : -1};
      render();
    });
  });
}
function renderSgMembers(){
  var f = filtOf("sg-members");
  var rows = S.people.filter(function(p){
    if(f.campus && p.campus !== f.campus) return false;
    if(f.gender && p.gender !== f.gender) return false;
    if(f.groupType && p.band.key !== f.groupType) return false;
    if(f.status === "member" && !p.member) return false;
    if(f.status === "nonmember" && p.member) return false;
    if(f.q){
      var hay = (p.name+" "+p.groupName+" "+p.leaderName).toLowerCase();
      if(hay.indexOf(f.q.toLowerCase()) < 0) return false;
    }
    return true;
  }).sort(function(a,b){ return a.rate - b.rate; }).slice(0, 400);

  el("view-sg-members").innerHTML =
    '<div class="panel"><div class="panel-hd"><h2>Group members</h2>'
    + '<p>'+S.people.length.toLocaleString()+' people in groups &middot; lowest attendance first</p></div>'
    + '<div class="tools">'
      + '<input type="search" data-f="q" value="'+esc(f.q)+'" placeholder="Search name or group">'
      + '<select data-f="campus"><option value="">Campus: all</option>'
        + uniq(S.people,"campus").map(function(c){
            return '<option value="'+esc(c)+'"'+(f.campus===c?" selected":"")+'>'+esc(c)+'</option>'; }).join("")
      + '</select>'
      + '<select data-f="groupType"><option value="">Band: all</option>'
        + BANDS.map(function(b){
            return '<option value="'+b.key+'"'+(f.groupType===b.key?" selected":"")+'>'+esc(b.note)+'</option>'; }).join("")
      + '</select>'
      + '<select data-f="gender"><option value="">Gender: all</option>'
        + '<option value="M"'+(f.gender==="M"?" selected":"")+'>Male</option>'
        + '<option value="F"'+(f.gender==="F"?" selected":"")+'>Female</option></select>'
      + '<select data-f="status"><option value="">Roll: all</option>'
        + '<option value="member"'+(f.status==="member"?" selected":"")+'>Members</option>'
        + '<option value="nonmember"'+(f.status==="nonmember"?" selected":"")+'>Attenders, not members</option></select>'
      + '<span class="selnote">'+rows.length+' shown'+(rows.length===400?" (first 400)":"")+'</span></div>'
    + '<div class="tscroll"><table><thead><tr><th>Name</th><th>Group</th>'
      + '<th class="n">Attendance</th>'+'<th>Band</th><th class="n">Present</th>'
      + '<th class="n">Direction</th><th class="n">vs last year</th><th>On the roll</th><th>Campus</th>'
      + '</tr></thead><tbody>'
      + rows.map(function(p){
          var d = p.dir, y = p.yoy;
          return '<tr><td class="name">'+esc(p.name)+'</td>'
            + '<td class="sub">'+esc(p.groupName)+'</td>'
            + '<td class="n">'+pct(p.rate)+'<span class="minibar"><i style="width:'+(p.rate*100)+'%"></i></span></td>'
            + '<td><span class="band '+p.band.cls+'">'+esc(p.band.note)+'</span></td>'
            + '<td class="n">'+p.attended+' of '+p.possible+'</td>'
            + '<td class="n"><span class="dir '+(d>.02?"up":d<-.02?"down":"flat")+'">'
              + (d>.02?"&uarr;":d<-.02?"&darr;":"&ndash;")+'</span></td>'
            + '<td class="n"><span class="dir '+(y>.02?"up":y<-.02?"down":"flat")+'">'
              + (y>0?"+":"")+pct(y)+'</span></td>'
            + '<td class="sub">'+(p.member?"Member":"Attender")+'</td>'
            + '<td class="sub">'+esc(p.campus)+'</td></tr>';
        }).join("")
    + '</tbody></table></div></div>';
  wireSgFilters("sg-members");
}
function wireSgFilters(tab){
  el("view-"+tab).querySelectorAll("[data-f]").forEach(function(c){
    c.addEventListener(c.tagName === "SELECT" ? "change" : "input", function(){
      filtOf(tab)[c.dataset.f] = c.value;
      render();
      if(c.dataset.f === "q"){
        var again = el("view-"+tab).querySelector('[data-f="q"]');
        if(again){ again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
      }
    });
  });
}

window.addEventListener("hashchange", route);
route();
</script>
